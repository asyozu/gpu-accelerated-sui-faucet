[package]
name = "sui-pow"
version = "0.1.0"
edition = "2021"
description = "Native Rust solver for the Sui testnet faucet proof of work"
license = "MIT"

[dependencies]
blake2 = "0.10.6"
clap = { version = "4.5", features = ["derive"] }
itoa = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

